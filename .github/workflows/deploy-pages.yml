name: Deploy EGX Intelligence to Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy-pages.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy static prototype
        run: npx wrangler@4 pages deploy prototype --project-name egx-intelligence --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
